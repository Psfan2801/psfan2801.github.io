<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #181b24;
      --display: #11131a;
      --btn: #232734;
      --btn-hover: #2e3344;
      --btn-sci: #1d202b;
      --btn-sci-hover: #282c3b;
      --btn-op: #2b3245;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --active-toggle: #8b5cf6;
      --danger: #ef4444;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .top-bar {
      width: 100%;
      max-width: 440px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover {
      color: var(--text);
    }

    .calculator {
      background: var(--panel);
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.55);
      border: 1px solid #262a38;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .mode-pill {
      background: var(--btn-sci);
      padding: 3px 10px;
      border-radius: 6px;
      font-weight: 600;
      color: #a78bfa;
      cursor: pointer;
      border: 1px solid #2e3344;
      min-width: 54px;
    }

    .mode-pill:hover {
      background: var(--btn-sci-hover);
    }

    .display {
      background: var(--display);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: right;
      border: 1px solid #222634;
      overflow-x: auto;
    }

    .history {
      color: var(--muted);
      font-size: 0.85rem;
      min-height: 1.2rem;
      margin-bottom: 6px;
      white-space: nowrap;
    }

    .current {
      font-size: 2rem;
      font-weight: 600;
      min-height: 2.5rem;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    button {
      background: var(--btn);
      color: var(--text);
      border: none;
      border-radius: 8px;
      padding: 13px 4px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.12s, transform 0.05s;
      user-select: none;
    }

    button:hover {
      background: var(--btn-hover);
    }

    button:active {
      transform: scale(0.95);
    }

    .sci {
      background: var(--btn-sci);
      color: #c4b5fd;
      font-size: 0.85rem;
    }

    .sci:hover {
      background: var(--btn-sci-hover);
    }

    .toggle-active {
      background: var(--active-toggle) !important;
      color: #fff !important;
      font-weight: bold;
    }

    .op {
      background: var(--btn-op);
      color: #60a5fa;
      font-weight: 600;
      font-size: 1.05rem;
    }

    .clear {
      background: rgba(239, 68, 68, 0.18);
      color: #f87171;
      font-weight: 600;
    }

    .clear:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    .equals {
      background: var(--accent);
      color: #fff;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .equals:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="../../index.html" class="back-link">&larr; Back to Hub</a>
    <span style="color: var(--muted); font-size: 0.85rem;">SCIENTIFIC</span>
  </div>

  <div class="calculator">
    <div class="status-bar">
      <button class="mode-pill" id="angleBtn" onclick="toggleAngle()" title="Click to switch DEG / RAD / GRAD">DEG</button>
      <span id="ansIndicator">Ans = 0</span>
    </div>

    <div class="display">
      <div class="history" id="history"></div>
      <div class="current" id="display">0</div>
    </div>

    <div class="grid">
      <!-- Row 1: Modes & Trig -->
      <button class="sci" id="btn2nd" onclick="toggleSecond()">2nd</button>
      <button class="sci" id="btnSin" onclick="handleTrig('sin')">sin</button>
      <button class="sci" id="btnCos" onclick="handleTrig('cos')">cos</button>
      <button class="sci" id="btnTan" onclick="handleTrig('tan')">tan</button>
      <button class="sci" onclick="appendVal('^')">xʸ</button>

      <!-- Row 2: Logs & Powers -->
      <button class="sci" id="btnLog" onclick="handleLog('log')">log</button>
      <button class="sci" id="btnLn" onclick="handleLog('ln')">ln</button>
      <button class="sci" id="btnPow2" onclick="handlePower()">x²</button>
      <button class="sci" onclick="appendVal('sqrt(')">&radic;x</button>
      <button class="sci" onclick="appendVal('!')">n!</button>

      <!-- Row 3: Brackets, Constants, Clear -->
      <button class="sci" onclick="appendVal('(')">(</button>
      <button class="sci" onclick="appendVal(')')">)</button>
      <button class="sci" onclick="appendVal('abs(')">|x|</button>
      <button class="clear" onclick="deleteLast()">DEL</button>
      <button class="clear" onclick="clearAll()">AC</button>

      <!-- Row 4: 7 8 9 / pi -->
      <button onclick="appendVal('7')">7</button>
      <button onclick="appendVal('8')">8</button>
      <button onclick="appendVal('9')">9</button>
      <button class="op" onclick="appendVal('/')">&divide;</button>
      <button class="sci" onclick="appendVal('pi')">&pi;</button>

      <!-- Row 5: 4 5 6 * e -->
      <button onclick="appendVal('4')">4</button>
      <button onclick="appendVal('5')">5</button>
      <button onclick="appendVal('6')">6</button>
      <button class="op" onclick="appendVal('*')">&times;</button>
      <button class="sci" onclick="appendVal('e')">e</button>

      <!-- Row 6: 1 2 3 - % -->
      <button onclick="appendVal('1')">1</button>
      <button onclick="appendVal('2')">2</button>
      <button onclick="appendVal('3')">3</button>
      <button class="op" onclick="appendVal('-')">-</button>
      <button class="sci" onclick="appendVal('%')">%</button>

      <!-- Row 7: 0 . Ans = + -->
      <button onclick="appendVal('0')">0</button>
      <button onclick="appendVal('.')">.</button>
      <button class="sci" onclick="appendVal('Ans')">Ans</button>
      <button class="equals" onclick="calculate()">=</button>
      <button class="op" onclick="appendVal('+')">+</button>
    </div>
  </div>

  <script>
    const displayEl = document.getElementById('display');
    const historyEl = document.getElementById('history');
    const angleBtn = document.getElementById('angleBtn');
    const ansIndicator = document.getElementById('ansIndicator');

    const angleModes = ['DEG', 'RAD', 'GRAD'];
    let angleIndex = 0; // 0 = DEG, 1 = RAD, 2 = GRAD
    let expression = '';
    let lastAns = 0;
    let isSecond = false;

    function updateDisplay() {
      displayEl.textContent = expression || '0';
    }

    function toggleAngle() {
      angleIndex = (angleIndex + 1) % angleModes.length;
      angleBtn.textContent = angleModes[angleIndex];
    }

    function toggleSecond() {
      isSecond = !isSecond;
      document.getElementById('btn2nd').classList.toggle('toggle-active', isSecond);
      document.getElementById('btnSin').textContent = isSecond ? 'asin' : 'sin';
      document.getElementById('btnCos').textContent = isSecond ? 'acos' : 'cos';
      document.getElementById('btnTan').textContent = isSecond ? 'atan' : 'tan';
      document.getElementById('btnLog').textContent = isSecond ? '10ˣ' : 'log';
      document.getElementById('btnLn').textContent = isSecond ? 'eˣ' : 'ln';
      document.getElementById('btnPow2').textContent = isSecond ? 'x³' : 'x²';
    }

    function appendVal(val) {
      if (expression === 'Error') expression = '';
      expression += val;
      updateDisplay();
    }

    function handleTrig(fn) {
      appendVal((isSecond ? 'a' + fn : fn) + '(');
    }

    function handleLog(type) {
      if (type === 'log') {
        appendVal(isSecond ? '10^(' : 'log(');
      } else {
        appendVal(isSecond ? 'e^(' : 'ln(');
      }
    }

    function handlePower() {
      appendVal(isSecond ? '^3' : '^2');
    }

    function deleteLast() {
      if (expression === 'Error') {
        expression = '';
      } else {
        expression = expression.slice(0, -1);
      }
      updateDisplay();
    }

    function clearAll() {
      expression = '';
      historyEl.textContent = '';
      updateDisplay();
    }

    function factorial(n) {
      if (n < 0 || !Number.isInteger(n)) return NaN;
      if (n > 170) return Infinity;
      let res = 1;
      for (let i = 2; i <= n; i++) res *= i;
      return res;
    }

    // Angle conversion helpers (DEG, RAD, GRAD)
    function toRadians(val) {
      const mode = angleModes[angleIndex];
      if (mode === 'DEG') return val * Math.PI / 180;
      if (mode === 'GRAD') return val * Math.PI / 200;
      return val;
    }

    function fromRadians(rad) {
      const mode = angleModes[angleIndex];
      if (mode === 'DEG') return rad * 180 / Math.PI;
      if (mode === 'GRAD') return rad * 200 / Math.PI;
      return rad;
    }

    const trig = {
      sin: (x) => Math.sin(toRadians(x)),
      cos: (x) => Math.cos(toRadians(x)),
      tan: (x) => {
        const mode = angleModes[angleIndex];
        if (mode === 'DEG' && Math.abs(x % 180) === 90) return NaN;
        if (mode === 'GRAD' && Math.abs(x % 200) === 100) return NaN;
        return Math.tan(toRadians(x));
      },
      asin: (x) => fromRadians(Math.asin(x)),
      acos: (x) => fromRadians(Math.acos(x)),
      atan: (x) => fromRadians(Math.atan(x))
    };

    function calculate() {
      if (!expression) return;
      try {
        let parsed = expression;

        // Implicit multiplication (e.g., 2pi -> 2*pi, 3(4) -> 3*(4))
        parsed = parsed
          .replace(/(\d)(pi|e|Ans|sin|cos|tan|asin|acos|atan|log|ln|sqrt|abs|\()/g, '$1*$2')
          .replace(/(\)|pi|e|Ans)(\d|\()/g, '$1*$2');

        // Factorials
        parsed = parsed.replace(/(\d+|\([^()]*\))!/g, 'factorial($1)');

        // Constants & functions
        parsed = parsed
          .replace(/\bAns\b/g, `(${lastAns})`)
          .replace(/\bpi\b/g, 'Math.PI')
          .replace(/\be\b/g, 'Math.E')
          .replace(/\basin\(/g, 'trig.asin(')
          .replace(/\bacos\(/g, 'trig.acos(')
          .replace(/\batan\(/g, 'trig.atan(')
          .replace(/\bsin\(/g, 'trig.sin(')
          .replace(/\bcos\(/g, 'trig.cos(')
          .replace(/\btan\(/g, 'trig.tan(')
          .replace(/\blog\(/g, 'Math.log10(')
          .replace(/\bln\(/g, 'Math.log(')
          .replace(/\bsqrt\(/g, 'Math.sqrt(')
          .replace(/\babs\(/g, 'Math.abs(')
          .replace(/\^/g, '**')
          .replace(/%/g, '/100');

        // Auto-close open parentheses
        const open = (parsed.match(/\(/g) || []).length;
        const close = (parsed.match(/\)/g) || []).length;
        if (open > close) parsed += ')'.repeat(open - close);

        const evaluator = new Function('trig', 'factorial', `"use strict"; return (${parsed});`);
        const result = evaluator(trig, factorial);

        if (typeof result !== 'number' || !isFinite(result) || isNaN(result)) {
          throw new Error('Math Error');
        }

        const formatted = Number(result.toPrecision(12)).toString();
        historyEl.textContent = expression + ' =';
        lastAns = Number(formatted);
        ansIndicator.textContent = 'Ans = ' + formatted;
        expression = formatted;
        updateDisplay();
      } catch (err) {
        historyEl.textContent = expression;
        expression = 'Error';
        updateDisplay();
      }
    }

    document.addEventListener('keydown', (e) => {
      if ((e.key >= '0' && e.key <= '9') || ['+', '-', '*', '/', '.', '(', ')', '^', '%', '!'].includes(e.key)) {
        e.preventDefault();
        appendVal(e.key);
      } else if (e.key === 'Enter' || e.key === '=') {
        e.preventDefault();
        calculate();
      } else if (e.key === 'Backspace') {
        e.preventDefault();
        deleteLast();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        clearAll();
      }
    });
  </script>
</body>
</html>
